<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Timer - NodeMCU</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <h1>Smart Timer Controller</h1>
  <p>Schedule your devices to turn on and off for any day of the year.</p>

  <div id="time-display">
    <h2>Current Time</h2>
    <p id="current-time">Loading...</p>
    <button id="send-time-btn" class="control-btn" onclick="sendTimeToNodeMCU()">
      Send Time to NodeMCU
    </button>
  </div>

  <div id="device-controls">
    <h2>Device Controls</h2>
    <div class="control-buttons">
      <button id="led-button" class="control-btn" onclick="toggleLED()">
        LED: <span id="led-status">Loading...</span>
      </button>
      <button id="bell-button" class="control-btn" onclick="toggleBell()">
        Bell: <span id="bell-status">Loading...</span>
      </button>
    </div>
  </div>
  
  <div id="config-panel">
    <h2>Device Settings</h2>
    <div class="form-group">
      <label for="bell-duration">Bell Duration (seconds):</label>
      <input type="number" id="bell-duration" min="0" max="60" step="1" value="3">
      <button class="control-btn" onclick="saveBellDuration()">Save</button>
    </div>
  </div>
  <!-- /////////////////////////// -->
  <div id="timer-schedules">
    <h2>Smart Timer Schedules</h2>
    <div id="schedule-counter">
      <p>Schedules: <span id="current-schedule-count">0</span>/366</p>
    </div>
    <div id="schedules-list">
      <p>Loading schedules...</p>
    </div>

  <!-- Add/Delete features removed - only edit functionality available -->
  </div>
  <!-- //////////////////////////////////////// -->
  <a class="button" href="/">Refresh</a>
  <footer>NodeMCU Web Server &copy; 2025</footer>

  <script src="./script.js"></script>
</body>

</html>
